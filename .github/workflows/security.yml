name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build:check
      - run: npm test
      - run: npm run security
      - run: npx playwright install --with-deps chromium
      - run: npm run security:site
      - run: npx playwright test
      - name: Verify the published store package
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { unzipSync } from 'fflate';
          const {storeVersion}=JSON.parse(await fs.readFile('website/releases.json','utf8'));
          assert.match(storeVersion,/^\d+(\.\d+){0,3}$/);
          const root=path.resolve('.qa/published');
          const files=unzipSync(await fs.readFile(`website/downloads/Scrollout-${storeVersion}.zip`));
          for(const [name,bytes] of Object.entries(files)){
            const target=path.resolve(root,name);
            assert.ok(target.startsWith(root+path.sep)&&!name.includes('\\'));
            await fs.mkdir(path.dirname(target),{recursive:true});
            await fs.writeFile(target,bytes);
          }
          NODE
          SCROLLOUT_QA_EXTENSION_DIR=.qa/published npx playwright test tests/e2e/security.spec.ts --grep 'production extension security'
